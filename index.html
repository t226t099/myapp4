<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Praise ToDo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Praise ToDo</h1>
            <div id="streak-container" class="streak-container">
                継続日数: <span id="streak-count">0</span>日連続！
            </div>
        </header>

        <main>
            <div id="ai-message" class="ai-message">
                タスクを入力して、一日を始めましょう！
            </div>

            <div id="progress-container" class="progress-container">
                <div class="progress-info">
                    <span>今日の進捗</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <section id="calendar-section" class="calendar-section">
                <div class="calendar-header">
                    <button id="prev-month">&lt;</button>
                    <h2 id="calendar-month-year">2026年5月</h2>
                    <button id="next-month">&gt;</button>
                </div>
                <div class="calendar-weekdays">
                    <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
                </div>
                <div id="calendar-days" class="calendar-days">
                    <!-- 日付がJavaScriptで生成されます -->
                </div>
            </section>

            <form id="todo-form">
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="新しいタスクを入力..." required>
                    <button type="submit">追加</button>
                </div>
                <div class="form-options">
                    <div class="type-selector">
                        <label>
                            <input type="radio" name="task-type" value="single" checked> 単発
                        </label>
                        <label>
                            <input type="radio" name="task-type" value="daily"> 日課
                        </label>
                    </div>
                    <div class="priority-selector">
                        優先度:
                        <select id="todo-priority">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                </div>
            </form>

            <div class="list-header">
                <h3>タスクリスト</h3>
                <button id="clear-completed" class="text-btn">完了済みを削除</button>
            </div>

            <ul id="todo-list">
                <!-- タスクがここに追加されます -->
            </ul>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
